    let active = 0;
    const tabs = document.querySelector('#tabs');
    const table = document.querySelector('#table');
    const search = document.querySelector('#search');
    const priority = document.querySelector('#priority');
    const count = document.querySelector('#count');
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function renderTabs() {
      tabs.innerHTML = sheets.map((sheet,index) => '<button data-index="'+index+'" class="'+(index===active?'active':'')+'">'+esc(sheet.name)+'</button>').join('');
    }
    function renderTable() {
      const sheet = sheets[active];
      const term = search.value.trim().toLowerCase();
      const rows = sheet.rows.filter((row) => {
        const isSummary = String(row[2] ?? '').includes('汇总');
        const priorityText = String(row[9] ?? '');
        const matchesPriority = !priority.checked || (priorityText.includes('紧急') && priorityText.includes('重要'));
        const matchesSearch = !term || row.some((cell) => String(cell ?? '').toLowerCase().includes(term));
        return (isSummary || matchesPriority) && matchesSearch;
      });
      count.textContent = rows.length + ' 行';
      if (!rows.length) { table.innerHTML='<div class="empty">没有匹配的数据</div>'; return; }
      const head = '<thead><tr>'+sheet.headers.map((h) => '<th>'+esc(h)+'</th>').join('')+'</tr></thead>';
      const body = '<tbody>'+rows.map((row) => {
        const p = String(row[9] ?? '');
        const classes = [(p.includes('紧急')&&p.includes('重要'))?'urgent':'',String(row[2]??'').includes('汇总')?'summary':''].filter(Boolean).join(' ');
        return '<tr class="'+classes+'">'+sheet.headers.map((_,i) => '<td>'+esc(row[i])+'</td>').join('')+'</tr>';
      }).join('')+'</tbody>';
      table.innerHTML='<table>'+head+body+'</table>';
    }
    tabs.addEventListener('click',(event)=>{ const button=event.target.closest('button[data-index]'); if(!button)return; active=Number(button.dataset.index); renderTabs(); renderTable(); });
    search.addEventListener('input',renderTable);
    priority.addEventListener('change',renderTable);
    renderTabs(); renderTable();
  </script>
